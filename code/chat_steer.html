<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>감정 슬라이더 대화</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#22211e;--muted:#6f6c64;--line:#dcd9d0;--accent:#0072B2;--on:#fff;--soft:#eeece5;--warn:#9a5b00;--warnbg:#fbf0dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b19;--card:#262623;--ink:#ecebe6;--muted:#a5a298;--line:#403f3a;--accent:#56B4E9;--on:#10222c;--soft:#32322e;--warn:#f0c674;--warnbg:#3a3020}}
:root[data-theme="dark"]{--bg:#1b1b19;--card:#262623;--ink:#ecebe6;--muted:#a5a298;--line:#403f3a;--accent:#56B4E9;--on:#10222c;--soft:#32322e;--warn:#f0c674;--warnbg:#3a3020}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
#wrap{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;height:100vh}
#wrap.nomap{grid-template-columns:280px minmax(0,1fr)}#wrap.nomap #map{display:none}
#map{border-left:1px solid var(--line);background:var(--card);padding:14px;overflow:auto}
#map svg{width:100%;height:auto;display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px}
#map svg text{font:10px "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;fill:var(--muted)}
#map svg text.hot{fill:var(--ink);font-weight:700}
#map svg .dot{fill:var(--muted)}#map svg .dot.hot{fill:var(--accent)}
#map svg .part{stroke:var(--muted);stroke-width:1.5;fill:none}
#map svg .sum{stroke:var(--accent);stroke-width:2.5;fill:none}
#map select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px;width:100%}
.cos{display:grid;grid-template-columns:70px 1fr 46px;gap:6px;align-items:center;font-size:13px;margin-bottom:2px}
.cos .track{position:relative;height:10px;background:var(--soft);border-radius:3px}
.cos .track i{position:absolute;top:0;height:100%;background:var(--accent);border-radius:2px}
.cos .track i.neg{background:#D55E00}
.cos .track u{position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--muted)}
.cos span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.cos.moved span:first-child{color:var(--muted)}
aside{border-right:1px solid var(--line);background:var(--card);padding:14px;overflow:auto}
main{display:flex;flex-direction:column;min-height:0}
h1{font-size:18px;margin:0 0 2px}
h2{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.sl{margin-bottom:8px}
.sl label{display:flex;justify-content:space-between;font-size:14px}
.sl output{font-variant-numeric:tabular-nums;color:var(--muted)}
.sl.on label b{color:var(--accent)}.sl.on output{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700;margin:14px 0 6px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 11px;min-height:38px;cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:700}
button:disabled{opacity:.45;cursor:default}
.check{font-size:13px;display:flex;gap:6px;align-items:center;margin-top:8px}
#status{padding:8px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
#log{flex:1;overflow:auto;padding:14px;min-height:0}
.empty{max-width:560px;margin:8vh auto;text-align:center;color:var(--muted)}
.ex{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.q{font-weight:700;margin:14px 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ans{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:64px}
.ans.steer{border-color:var(--accent)}
.tag{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:4px;white-space:normal}
.bad{display:inline-block;background:var(--warnbg);color:var(--warn);border-radius:4px;padding:0 6px;font-size:12px;font-weight:700;margin-left:6px}
form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--card)}
textarea{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;height:44px;resize:none}
#warn{display:none;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:6px 8px;font-size:13px;margin-top:8px}
@media (max-width:760px){
  #wrap{display:block;height:auto}
  aside{border-right:0;border-bottom:1px solid var(--line);max-height:44vh}
  #map{border-left:0;border-top:1px solid var(--line)}
  main{height:auto}#log{overflow:visible}
  .pair{grid-template-columns:minmax(0,1fr)}
  form{position:sticky;bottom:0}
}
</style>
</head>
<body>
<div id="wrap">
<aside>
  <h1>감정 슬라이더 대화</h1>
  <div class="sub">Kanana 2 3B · 23층. 슬라이더는 모델 안의 값을 미는 장치이며, AI가 감정을 느낀다는 뜻은 아닙니다.</div>
  <h2>주요 감정</h2><div id="main"></div>
  <details><summary>나머지 감정 17개</summary><div id="more"></div></details>
  <h2>대조</h2><div id="ctrl"></div>
  <div id="warn"></div>
  <div class="row" style="margin-top:10px"><button id="reset" type="button">전부 0으로</button><button id="redo" type="button" disabled>이 세기로 다시</button></div>
  <label class="check"><input type="checkbox" id="auto" checked>슬라이더를 놓으면 바로 다시 만들기</label>
  <label class="check"><input type="checkbox" id="showmap" checked>벡터 지도 보기</label>
</aside>
<main>
  <div id="status"><span id="st">모델을 불러오는 중입니다</span><span id="gpu"></span><span id="info"></span></div>
  <div id="log"></div>
  <form id="f"><textarea id="t" placeholder="질문을 입력하세요 (Enter로 보내기, Shift+Enter로 줄바꿈)"></textarea><button class="main" id="go" disabled>보내기</button><button type="button" id="stop" disabled>멈춤</button><button type="button" id="clear">새 대화</button></form>
</main>
<section id="map">
  <h1>벡터 지도</h1>
  <label class="sl" style="display:block;margin-top:6px"><span style="display:flex;justify-content:space-between;font-size:14px"><b>지도 층</b><output id="layerOut"></output></span><input type="range" id="layer" min="0" step="1"></label>
  <div class="sub" id="share"></div>
  <svg id="plane" viewBox="0 0 312 312" role="img" aria-label="감정 벡터 2차원 지도"></svg>
  <div class="sub" id="fit" style="margin-top:6px"></div>
  <h2>내 예상과 비교</h2>
  <label class="sub" for="guess">이 조합이 어떤 감정에 가장 가까울 것 같나요?</label>
  <select id="guess"></select>
  <div class="sub" id="verdict" style="margin-top:6px"></div>
  <h2>코사인 유사도 (2560차원)</h2>
  <div class="sub" style="margin-bottom:6px">슬라이더 값이 모두 0이면 표시되지 않습니다.</div>
  <div id="cos"></div>
  <details><summary>감정 전체 보기</summary><div id="cosall"></div></details>
</section>
</div>

  const X=v=>C+v/r*C,Y=v=>C-v/r*C;
  const line=(a,b,c)=>`<line class="${c}" x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}"/>`;
  const dots=MAP.names.map((k,i)=>{const [x,y]=xy[i],hot=!!w[i],e=X(x)>250;return `<circle class="dot ${hot?'hot':''}" cx="${X(x)}" cy="${Y(y)}" r="${hot?5:3.5}"><title>${esc(nameOf(k))}</title></circle><text class="${hot?'hot':''}" x="${X(x)+(e?-6:6)}" y="${Y(y)+3}" text-anchor="${e?'end':'start'}">${esc(nameOf(k))}</text>`;}).join('');
  const mark=(a,b)=>{const t=Math.hypot(X(b[0])-X(a[0]),Y(b[1])-Y(a[1]));return t>2?`<circle cx="${X(b[0])}" cy="${Y(b[1])}" r="5" style="fill:var(--accent)"/>`:'';};
  $('plane').innerHTML=`<line x1="0" y1="${C}" x2="312" y2="${C}" stroke="var(--line)"/><line x1="${C}" y1="0" x2="${C}" y2="312" stroke="var(--line)"/>${dots}${parts.map(p=>line(p[0],p[1],'part')).join('')}${parts.length?line([0,0],tip,'sum')+mark([0,0],tip):''}`;
  const L=MAP.layers[LI];
  $('layerOut').textContent=`${L}층${L===MAP.steer?' (슬라이더가 미는 층)':''}`;
  $('share').textContent=`${L}층의 감정 20개와 무작위 방향을 2차원으로 눌러 그린 지도. 전체 차이의 ${(MAP.share[LI]*100).toFixed(0)}%만 담습니다.${L===MAP.steer?'':` 답변은 여전히 ${MAP.steer}층에서 밉니다. 이 층의 코사인은 비교용입니다.`}`;
  $('fit').textContent=len?`굵은 선이 합친 방향입니다. 실제 길이 ${len.toFixed(2)} 중 이 지도에 보이는 길이는 ${Math.hypot(...tip).toFixed(2)}이고, 나머지는 지도 밖 방향입니다.`:'슬라이더를 움직이면 합친 방향이 그려집니다.';
  if(!cos){$('cos').innerHTML=$('cosall').innerHTML=$('verdict').textContent='';return;}
  const rows=MAP.names.map((k,i)=>({k,c:cos[i],moved:!!w[i]})).filter(x=>x.k!=='random0'||x.moved).sort((a,b)=>b.c-a.c);
  const html=x=>cosRow(x.k,x.c,x.moved);
  $('cos').innerHTML=[...rows.slice(0,5),...rows.slice(-3)].map(html).join('')+'<div class="sub">* 내가 민 감정</div>';
  $('cosall').innerHTML=rows.map(html).join('');
  const free=rows.filter(x=>!x.moved),g=$('guess').value,pick=free.findIndex(x=>x.k===g);
  $('verdict').textContent=!g?`민 감정을 뺀 1위는 ${nameOf(free[0].k)} (${free[0].c.toFixed(2)})입니다.`:pick<0?'내가 민 감정은 예상 비교에서 빠집니다. 다른 감정을 고르세요.':`내 예상 ${nameOf(g)}: 민 감정을 뺀 ${free.length}개 중 ${pick+1}위 (${free[pick].c.toFixed(2)}). 1위는 ${nameOf(free[0].k)} (${free[0].c.toFixed(2)}).`;
}
$('guess').innerHTML='<option value="">고르세요</option>'+Object.keys(NAMES).map(k=>`<option value="${k}">${NAMES[k]}</option>`).join('');
$('guess').onchange=drawMap;
let LI=MAP?MAP.layers.indexOf(MAP.steer):0;
if(MAP){$('layer').max=MAP.layers.length-1;$('layer').value=LI;$('layer').oninput=e=>{LI=+e.target.value;drawMap();};}
$('showmap').onchange=e=>$('wrap').classList.toggle('nomap',!e.target.checked);
const active=()=>Object.fromEntries(Object.entries(vals).filter(([,v])=>v!==0));
const label=s=>{const e=Object.entries(s);return e.length?e.map(([k,v])=>`${k==='random0'?'무작위':NAMES[k]} ${v>0?'+':''}${v.toFixed(2)}`).join(', '):'슬라이더 0 (기준과 같음)';};
function view(){
  const log=$('log');
  if(!turns.length){log.innerHTML=`<div class="empty">왼쪽 슬라이더를 움직이고 질문을 보내면, 같은 질문의 기준 답변과 민 답변이 나란히 나옵니다.<div class="ex">${EX.map(x=>`<button type="button" data-ex="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>`;return;}
  log.innerHTML=turns.map(t=>`<div class="q">${esc(t.q)}</div><div class="pair"><div class="ans"><span class="tag">기준 답변${t.bad[0]?'<span class="bad">문장 붕괴</span>':''}</span>${esc(t.a[0])}</div><div class="ans steer"><span class="tag">민 답변 · ${esc(label(t.s))}${t.bad[1]?'<span class="bad">문장 붕괴</span>':''}</span>${esc(t.a[1])}</div></div>`).join('');
}
function setBusy(b){busy=b;$('stop').disabled=!b;$('go').disabled=!ready||b;$('redo').disabled=!ready||!turns.length;}
async function run(){
  const t=turns[turns.length-1],past=turns.slice(0,-1);
  const hist=i=>[...past.flatMap(p=>[{role:'user',content:p.q},{role:'assistant',content:p.a[i]}]),{role:'user',content:t.q}];
  ctrl&&ctrl.abort();
  const me=ctrl=new AbortController();
  setBusy(true);$('st').textContent='답변을 만드는 중입니다';$('info').textContent='';
  view();
  const stick=()=>{const l=$('log');l.scrollTop=l.scrollHeight;};stick();
  const t0=Date.now();
  const clock=setInterval(()=>{if(me===ctrl&&busy)$('st').textContent=`답변을 만드는 중입니다 (${Math.round((Date.now()-t0)/1000)}초)`;else clearInterval(clock);},1000);
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Key':KEY},body:JSON.stringify({base:hist(0),steer:hist(1),sliders:t.s}),signal:me.signal});
    if(!r.ok)throw new Error('서버 응답 '+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
      const {value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const line of lines){
        const m=JSON.parse(line);
        if(m.strength!==undefined)$('info').textContent=`입력 ${m.tokens}토큰 · 합친 세기 ${m.strength}`;
        if(m.texts){t.a=m.texts;view();stick();}
        if(m.done){t.bad=m.collapsed;view();$('st').textContent=m.stopped?'멈췄습니다':`완료 (${m.seconds}초)`;}
      }
    }
  }catch(e){if(e.name==='AbortError')return;$('st').textContent='오류: '+e.message;}
  if(me===ctrl)setBusy(false);
}
function rerun(){if(!ready||!turns.length)return;const t=turns[turns.length-1];t.s=active();t.a=['',''];t.bad=[false,false];run();}
function ask(q){turns.push({q,s:active(),a:['',''],bad:[false,false]});run();}
function halt(){ctrl&&ctrl.abort();ctrl=null;fetch('/api/stop',{method:'POST',headers:{'X-Key':KEY}});setBusy(false);$('st').textContent='멈췄습니다';}
$('f').onsubmit=e=>{e.preventDefault();const q=$('t').value.trim();if(!q||!ready||busy)return;$('t').value='';ask(q);};
$('t').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('f').requestSubmit();}};
$('stop').onclick=halt;
$('clear').onclick=()=>{if(busy)halt();turns=[];view();setBusy(false);};
$('redo').onclick=rerun;
$('reset').onclick=()=>{Object.keys(vals).forEach(k=>{vals[k]=0;$('s_'+k).value=0;});paint();if($('auto').checked)rerun();};
$('log').onclick=e=>{const b=e.target.closest('[data-ex]');if(b&&ready&&!busy)ask(b.dataset.ex);};
function lock(msg){
  $('st').innerHTML=`<label>${esc(msg)} <input type="password" id="key" autocomplete="off" style="font:inherit;width:190px"></label> <button type="button" id="enter">들어가기</button>`;
  const go=()=>{KEY=$('key').value.trim();poll();};
  $('enter').onclick=go;
  $('key').onkeydown=e=>{if(e.key==='Enter')go();};
  $('key').focus();
}
async function poll(){
  try{
    const s=await(await fetch('/api/status',{headers:{'X-Key':KEY}})).json();
    if(!s.allowed)return lock(KEY?'비밀번호가 틀렸습니다':'비밀번호');
    if(s.error){$('st').textContent='모델 오류: '+s.error;return;}
    if(s.ready){ready=true;LIMIT=s.limit;$('st').textContent='준비됐습니다';setBusy(false);gpuLoop();return;}
    $('st').textContent='모델을 불러오는 중입니다';
  }catch(e){}
  setTimeout(poll,1000);
}
async function gpuLoop(){
  try{
    const g=(await(await fetch('/api/status',{headers:{'X-Key':KEY}})).json()).gpu;
    if(g&&!g.error)$('gpu').textContent=`GPU ${g.util.toFixed(0)}% · 메모리 ${(g.used/1024).toFixed(1)}/${(g.total/1024).toFixed(1)}GB (${(g.used/g.total*100).toFixed(0)}%)`;
  }catch(e){}
  setTimeout(gpuLoop,2000);
}
paint();view();poll();
</script>
</body>
